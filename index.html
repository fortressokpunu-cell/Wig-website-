<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMONBLAQ Hairs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">OMONBLAQ Hairs</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#wigs">Wigs</a>
      <a href="#services">Services</a>
      <a href="#testimonials">Testimonials</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Beautiful wigs, made to make you shine</h2>
    <p>Quality wigs for every style and occasion.</p>
    <a class="button" href="#">Chat on WhatsApp</a>
  </section>

  <section class="wigs" id="wigs">
    <h2>Our Wigs</h2>
    <div class="wig-grid" id="wig-grid"></div>
  </section>

  <script src="wigs.js"></script>
  <script>
    const grid = document.getElementById("wig-grid");
    wigs.forEach(function (wig) {
      let photo = "Photo coming soon";
      if (wig.image) {
        photo = '<img src="images/' + wig.image + '" alt="' + wig.name + '">';
      }
      grid.innerHTML +=
        '<div class="wig-card">' +
          '<div class="wig-photo">' + photo + '</div>' +
          '<h3>' + wig.name + '</h3>' +
          '<p class="wig-price">' + wig.price + '</p>' +
        '</div>';
    });
  </script>

</body>
</html>
